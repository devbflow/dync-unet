seed_everything: 42

trainer:
  logger: true
  max_epochs: 100
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  default_root_dir: ./logs
  fast_dev_run: False
  overfit_batches: 0.0

model:
  conv_type: static
  in_channels: 3
  num_classes: 9
  lr: 1e-3

data:
  data_dir: ./
  batch_size: 32
  img_size: 512
  num_workers: 4

ckpt_path: null