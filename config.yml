seed_everything: 42

trainer:
  logger: true
  max_epochs: 100
  max_time: 01:00:00:00
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  default_root_dir: ./logs
  fast_dev_run: False
  overfit_batches: 0.0
  enable_progress_bar: False

model:
  conv_type: static
  in_channels: 3
  num_classes: 9
  num_layers: 4
  initial_planes: 64
  lr: 1e-3
  K: null

data:
  data_dir: ./
  batch_size: 32
  img_size: 512
  num_workers: 4

ckpt_path: null